name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  push:
    name: Push / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: services/auth
            image: darko999/auth-service
          - service: book
            context: services/book
            image: darko999/book-service
          - service: gateway
            context: services/gateway
            image: darko999/api-gateway
          - service: inventory
            context: services/inventory
            image: darko999/inventory-service
          - service: notification
            context: services/notification
            image: darko999/notification-service
          - service: order
            context: services/order
            image: darko999/order-service
          - service: frontend
            context: frontend
            image: darko999/frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify:
    name: Notify chaos-engineering-sandbox
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CHAOS_SANDBOX_DISPATCH_TOKEN }}
          repository: darkobjelicic/chaos-engineering-sandbox
          event-type: bookstore-image-published
          client-payload: '{"sha": "${{ github.sha }}"}'
